# SD Systems SBC-200 -- a 4 MHz Z80 single-board computer running the MSMONR21 monitor.
#
#     altairsim sbc200
#     (press Enter)              <- the monitor auto-detects your baud from the CR
#     .                          <- the monitor prompt
#
# WHY YOU MUST PRESS ENTER FIRST. The SBC-200 wires the 8251 USART's RxD line to its
# /DSR input. MSMONR21 auto-detects the console baud rate by timing the start bit of
# the first character you type (a CR), spinning on 8251 status bit 7 (DSR). It prints
# NOTHING until you press Enter -- that is authentic, not a hang. Then it prints its
# `.` prompt; the command set is in reference/SD Systems Monitor.md.
#
# RESET STARTS THE MONITOR. The board's auto-start jumpers are set for E000 (`start`
# below), so after a reset the Z80 reads the monitor PROM, and `RUN` is all the startup
# needs. `RESET` then `RUN` brings the monitor back.

[machine]
name    = "sbc200"
startup = ["RUN"]             # the board's auto-start puts the Z80 in the monitor PROM

# THE CPU. The SBC-200 is a 4 MHz Z80. clock_hz sets the crystal the 8251 divides to
# turn baud into T-states (and it is what makes the auto-baud bit width period-correct).
[[board]]
type     = "z80"
id       = "cpu0"
clock_hz = 4000000

# THE CONSOLE: an Intel 8251 USART at 7C (data) / 7D (status+command), with RxD strapped
# to /DSR (the board does this by default) so the monitor can auto-baud.
[[board]]
type    = "sbc"
id      = "ser0"
variant = "sbc200"
port    = 7C
start   = E000                # the auto-start jumpers: a reset reads the PROM at E000

  [board.unit.tty]
  connect = "console"
  baud    = 9600

  # THE ONBOARD PROM SOCKETS (the etch: 2K PROMs in the top bank). The onboard 1K RAM is
  # at F800-FFFF; the monitor keeps its stack and register-save area there (FF60-FFFF).
  [[board.socket]]
  at    = E000
  mount = "builtin:msmonr21"  # the MSMONR21 monitor

  [[board.socket]]
  at    = F000
  mount = "builtin:ddb200"    # the DDBIOS disk BIOS

# MEMORY: 64K of RAM under the onboard memory. `honors_phantom = "read"`: while the onboard
# PROMs and RAM are switched in they answer the reads, and a write still reaches this
# board. After `OUT 7F` with bit 1 set, this board has all 64K.
[[board]]
type           = "memory"
id             = "mem0"
fill           = "random"     # real static RAM does not come up zeroed
honors_phantom = "read"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
