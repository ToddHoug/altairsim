# An HD63484 ACRTC graphics board with a Bt453 RAMDAC in an Altair -- the bench for cadzilla.
#
# The board is our own design (docs/boards/cadzilla.md), built from two real mid-1980s chips,
# on a fixed VESA monitor (`mode`, 640x480 here). It is wired for 8 bits per pixel and an
# address increment of 8 words per display cycle; the register values for every mode are in
# the board's reference. One 8-port I/O block: `port`/`port+2` the ACRTC (RS=0/RS=1 -- NOT
# adjacent), `port+1` the board's own MODE register (single vs. interleaved access, sync
# polarity), `port+4..+7` the Bt453. 2 MB of SRAM is fixed, not a strap.
#
# `altairsim cadzilla` comes up at the monitor prompt. The board draws nothing until a program
# sets the ACRTC's timing registers, starts it, loads the Bt453's color table and issues drawing
# commands through the FIFO -- there is no framebuffer in RAM to poke. The 640x480 picture from
# the monitor prompt (OUT 70 = address register RS=0, OUT 72 = data RS=1, OUT 71 = MODE;
# r80+ auto-increment):
#
#     OUT 70 02 / OUT 72 03 / OUT 70 03 / OUT 72 00      ; CCR $0300: 8 bits per pixel
#     OUT 70 82 / OUT 72 31 / OUT 72 06                  ; HSR: HC 49, HSW 6
#     OUT 72 02 / OUT 72 27                              ; HDR: HDS 2, HDW 39 (40 cycles = 640 px)
#     OUT 72 02 / OUT 72 0D                              ; VSR: VC 525
#     OUT 72 20 / OUT 72 02                              ; VDR: VDS 32, VSW 2
#     OUT 72 01 / OUT 72 E0                              ; SP1: 480 rasters
#     OUT 70 CA / OUT 72 01 / OUT 72 40                  ; MWR1: 320 words per raster
#     OUT 72 00 / OUT 72 00 / OUT 72 00 / OUT 72 00      ; SAR1: 0
#     OUT 70 06 / OUT 72 40 / OUT 70 07 / OUT 72 00      ; DCR $4000: base screen on
#     OUT 70 04 / OUT 72 40 / OUT 70 05 / OUT 72 30      ; OMR $4030: start, GAI +8
#     OUT 71 00                                          ; MODE: HSPOL/VSPOL positive, single access
#     SHOW cad0                                          ; video on, picture 640x480 at (0,0), wiring ok
#
# It needs a host Display. With SDL3 present the picture shows in a window titled after the
# board; in a headless build the machine runs identically and draws nothing.

[machine]
name = "cadzilla"

[[board]]
type     = "8080"
id       = "cpu0"
clock_hz = 2000000

# A console, so the machine is one you can talk to: the board is a DISPLAY, not a keyboard.
[[board]]
type = "2sio"
id   = "sio0"
port = 10

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"

# THE BOARD. One 8-port block at 70-77 (ACRTC RS=0 at 70, MODE at 71, ACRTC RS=1 at 72,
# Bt453 at 74-77), a 640x480 monitor (all the defaults). 2 MB of SRAM is fixed. It decodes
# no memory at all; the picture lives on the board. `interrupt` (SW1-8) defaults to `none`.
[[board]]
type = "cadzilla"
id   = "cad0"
port = 0x70
mode = "640x480"

[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "64K"
