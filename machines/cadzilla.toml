# An HD63484 ACRTC graphics board with a Bt453 RAMDAC in an Altair -- the bench for CADzilla.
#
# The board is a new custom product based on period components (docs/boards/cadzilla.md):
# two real mid-1980s chips, on a fixed VESA monitor (`mode`, one of the three primary VESA
# resolutions -- 640x480, 800x600 or 1024x768 -- selectable right here in the machine file,
# or with `SET cad0 mode=...` at the prompt; 1024x768 here, the board's own default). It is wired for 8 bits
# per pixel and an address increment of 8 words per display cycle; the register values for
# every mode are in the board's reference. One 8-port I/O block: `port`/`port+2` the ACRTC
# (RS=0/RS=1 -- NOT adjacent), `port+1` the board's own MODE register (single vs. interleaved
# access, sync polarity), `port+4..+7` the Bt453. 2 MB of SRAM is fixed, not a strap.
#
# `altairsim cadzilla` comes up at the monitor prompt. The board draws nothing until a program
# sets the ACRTC's timing registers, starts it, loads the Bt453's color table and issues drawing
# commands through the FIFO -- there is no framebuffer in RAM to poke. The 1024x768 picture from
# the monitor prompt (OUT 70 = address register RS=0, OUT 72 = data RS=1, OUT 71 = MODE;
# r80+ auto-increment):
#
#     OUT 70 02 / OUT 72 03 / OUT 70 03 / OUT 72 00      ; CCR $0300: 8 bits per pixel
#     OUT 70 82 / OUT 72 53 / OUT 72 08                  ; HSR: HC 83, HSW 8
#     OUT 72 09 / OUT 72 3F                              ; HDR: HDS 9, HDW 63 (64 cycles = 1024 px)
#     OUT 72 03 / OUT 72 26                              ; VSR: VC 806
#     OUT 72 1C / OUT 72 06                              ; VDR: VDS 28, VSW 6
#     OUT 72 03 / OUT 72 00                              ; SP1: 768 rasters
#     OUT 70 CA / OUT 72 02 / OUT 72 00                  ; MWR1: 512 words per raster
#     OUT 72 00 / OUT 72 00 / OUT 72 00 / OUT 72 00      ; SAR1: 0
#     OUT 70 06 / OUT 72 40 / OUT 70 07 / OUT 72 00      ; DCR $4000: base screen on
#     OUT 70 04 / OUT 72 40 / OUT 70 05 / OUT 72 30      ; OMR $4030: start, GAI +8
#     OUT 71 00                                          ; MODE: HSPOL/VSPOL positive, single access
#     SHOW cad0                                          ; video on, picture 1024x768 at (0,0), wiring ok
#
# For the 640x480 or 800x600 case instead, `SET cad0 mode=640x480` (or 800x600) before this
# recipe, and use that mode's own register values from the board's reference -- the recipe
# above is specific to whichever mode is currently strapped, not to any one resolution.
#
# It needs a host Display. With SDL3 present the picture shows in a window titled after the
# board; in a headless build the machine runs identically and draws nothing.
#
# THE REST OF THE MACHINE is our own development bench, not period software's: the same
# front panel, disk controller (empty) and host bridge as `default.toml`, so CADzilla can be
# developed and tested alongside a realistic supporting complement -- moving a test program in
# with the host bridge, say, or exercising the board next to a disk controller that also
# decodes I/O -- without dragging in DBL or a boot disk this board has no use for.

[machine]
name = "cadzilla"

[[board]]
type  = "fp"
id    = "fp0"
sense = 0x00

[[board]]
type     = "8080"
id       = "cpu0"
clock_hz = 0                  # flat out (the default); SET cpu0 clock_hz=2000000 for 2 MHz

# A console, so the machine is one you can talk to: the board is a DISPLAY, not a keyboard.
[[board]]
type = "2sio"
id   = "sio0"
port = 10

  [board.unit.a]
  connect = "console"
  baud    = 9600

  [board.unit.b]
  connect = "null"

# THE BOARD. One 8-port block at 70-77 (ACRTC RS=0 at 70, MODE at 71, ACRTC RS=1 at 72,
# Bt453 at 74-77), a 1024x768 monitor (the board's own default -- `mode` also takes 640x480
# or 800x600, the other two primary VESA resolutions). 2 MB of SRAM is fixed. It decodes
# no memory at all; the picture lives on the board. `interrupt` (SW1-8) defaults to `none`.
#
# `draw_rate` is how fast the ACRTC draws. `full` (the board's default, and this bench's
# choice): every command is done the moment it lands, so a program under development never
# waits on the chip. `real`: each command takes the time the HD63484 data sheet gives it,
# paid in the memory cycles the display leaves free -- the write FIFO fills and CED comes
# late, as on the card. Use `real` for anything timing-sensitive, a game above all
# (`SET cad0 draw_rate=real` at the prompt). It is independent of `cpu0 clock_hz`: that only
# decides whether the host waits, and the drawing time is the same number of instructions
# at any CPU speed setting.
[[board]]
type      = "cadzilla"
id        = "cad0"
port      = 0x70
mode      = "1024x768"
draw_rate = "full"

# THE FLOPPY CONTROLLER -- an 88-DCDD at 0x08, four drives, no disks: the same honest empty
# default as `default.toml`. Nothing in this machine boots from it; it is here so the bench
# has a realistic disk controller decoding I/O alongside CADzilla's own ports.
[[board]]
type   = "dcdd"
id     = "dsk0"
port   = 08
drives = 4

# THE HOST BRIDGE, at port B0 -- moves a file in or out of a running guest (`R`/`W`/`HDIR`
# from `cpm/hostbridge/*.ASM`, or just useful for staging a test program). See
# `machines/default.toml` for the whole story; `hostdir = ""` is the shell's working directory.
[[board]]
type    = "hostbridge"
id      = "hb0"
port    = B0
hostdir = ""

[[board]]
type = "memory"
id   = "mem0"
fill = "random"               # real static RAM does not come up zeroed

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "56K"                # 0000-DFFF, matching `default.toml` -- no boot PROM here,
                               # but the same headroom for one and for the memory-mapped I/O
                               # a real machine put above it
