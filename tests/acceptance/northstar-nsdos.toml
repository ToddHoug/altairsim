# North Star acceptance fixture: the MDS-A with North Star DOS 5.1 (single density) in drive 1, mounted
# WRITE-PROTECTED so the test can never change the tracked image (the .exp checks its hash).

[machine]
name    = "northstar-nsdos"
base    = "northstar"
startup = ["RUN E900"]

[[board]]
type = "mdsa"
id   = "fd0"

  [[board.drive]]
  unit         = 0
  mount        = "../media/northstar/NSDOS-51-SDC-ALTAIR.NSI"
  writeprotect = true

[console]
bsdel = "bs"
