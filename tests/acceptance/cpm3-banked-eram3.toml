# Banked CP/M 3 boot acceptance fixture on the ExpandoRAM III: the same SBC-200 + VersaFloppy II
# machine as cpm3-banked.toml, but its 256K of RAM is one ExpandoRAM III board (bankmem
# card=expandoram3, config=cpm). The III's PROM map (manual Fig 2-2) gives pages 0-4 of 48K
# at 0000-BFFF and one 16K common cell at C000-FFFF, which is the layout SD Systems CP/M 3
# expects on port FF. Reaching A> and running DIR proves the cell map end to end: CP/M 3
# switches to page 1 for its banked BDOS/BIOS and back to page 0 for the TPA.
#
# Both disks are mounted READ-ONLY, as in cpm3-banked.toml; cpm3-banked.exp shasums them.

[machine]
name    = "cpm3-banked-eram3-acceptance"
startup = ["RUN"]

[[board]]
type     = "z80"
id       = "cpu0"
clock_hz = 4000000

[[board]]
type    = "sbc"
id      = "sbc0"
variant = "sbc200"
port    = 7C
start   = E000

  [board.unit.tty]
  connect = "console"
  baud    = 9600

  [[board.socket]]
  at    = E000
  mount = "builtin:msmonr21"

  [[board.socket]]
  at    = F000
  mount = "builtin:ddb200"

[[board]]
type           = "bankmem"
id             = "mem0"
card           = "expandoram3"
config         = "cpm"
ram            = 256
honors_phantom = "read"
fill           = "random"

[[board]]
type    = "versafloppy"
id      = "vf0"
variant = "vfii"
port    = 60

  [[board.drive]]
  unit         = 0
  mount        = "../media/sdsys/CPM3-B-SSDD-60K-DISK1.DSK"
  writeprotect = true

  [[board.drive]]
  unit         = 1
  mount        = "../media/sdsys/CPM3-B-SSDD-DISK2.DSK"
  writeprotect = true
